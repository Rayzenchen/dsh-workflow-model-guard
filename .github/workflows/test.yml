name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check index.js
      - name: Self-test
        run: node tools/self-test.mjs
      - name: Deny-message check
        run: node tools/deny-equivalence.mjs
